<div class="admin-libro-container">
  <!-- Botón para regresar al inicio -->
  <a routerLink="/" class="volver-inicio">
    <button mat-button class="btn-azul" type="button">Regresar al inicio</button>
  </a>
  <h2>Crear Libro</h2>

  <form [formGroup]="libroForm" (ngSubmit)="guardar()">
    <!-- Información General del Libro -->
    <div class="seccion">
      <h3>Información General del Libro</h3>

      <label>
        Título del Libro *
        <input type="text" formControlName="titulo" placeholder="Título del Libro" />
      </label>

      <div class="fila">
        <label>
          Autor *
          <input type="text" formControlName="autor" placeholder="Insertar Autor" />
        </label>

        <label>
          Editorial *
          <input type="text" formControlName="editorial" placeholder="Insertar Editorial" />
        </label>

        <label>
          Año *
          <input type="number" formControlName="anio" placeholder="Insertar Año" />
        </label>
      </div>

      <label>
        Archivo y Portada *
        <div class="subida-archivo">
          <input type="file" (change)="onPortadaSelected($event)" accept=".jpg,.png" />
          <button type="button" (click)="eliminarPortada()">🗑</button>
          <small>Formatos .jpg / .png</small>
        </div>

        <div class="subida-archivo">
          <input type="file" (change)="onPdfSelected($event)" accept=".pdf" />
          <button type="button" (click)="eliminarPDF()">🗑</button>
        </div>
      </label>

      <div *ngIf="!portadaUrl && libroForm.touched" class="error">Debes subir una portada.</div>
      <div *ngIf="!pdfUrl && libroForm.touched" class="error">Debes subir el PDF.</div>
      <div *ngIf="libroForm.invalid && libroForm.touched" class="error">Completa todos los campos obligatorios.</div>
    </div>

    <!-- Descripción y Reseña -->
    <div class="seccion">
      <label>
        Descripción y Reseña *
        <textarea formControlName="descripcion" rows="6" placeholder="Escribe una descripción del libro..."></textarea>
      </label>
    </div>

    <!-- Nivel de Recomendación -->
    <div class="seccion">
      <label>Nivel de Recomendación *</label>
      <div class="estrellas">
        <ng-container *ngFor="let star of [1, 2, 3, 4, 5]">
          <span
            class="estrella"
            [class.seleccionada]="star <= nivelRecomendacion"
            (click)="setRecomendacion(star)"
          >★</span>
        </ng-container>
      </div>
    </div>

    <!-- Estado del Libro -->
    <div class="seccion">
      <label>Estado del Libro *</label>
      <div class="checkboxes" formGroupName="estado">
        <label>
          <input type="checkbox" formControlName="borrador" />
          Borrador
        </label>
        <label>
          <input type="checkbox" formControlName="programarPublicacion" />
          Programar Publicación
        </label>
      </div>
    </div>

    <!-- Opciones Adicionales -->
    <div class="seccion">
      <label>Opciones Adicionales *</label>
      <div class="checkboxes" formGroupName="opciones">
        <label>
          <input type="checkbox" formControlName="destacada" />
          Noticia Destacada
        </label>
        <label>
          <input type="checkbox" formControlName="comentarios" />
          Activar Comentarios
        </label>
        <label>
          <input type="checkbox" formControlName="boletin" />
          Añadir Boletín
        </label>
      </div>
    </div>

    <!-- Botones de acción -->
    <div class="botones-accion">
      <button type="submit">Guardar</button>
      <button type="button" (click)="guardarComoBorrador()">Guardar como borrador</button>
      <button type="button" class="publicar" (click)="publicar()">Publicar</button>
    </div>
  </form>
</div>
