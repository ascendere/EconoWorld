
<div class="admin-container">
    <!-- Botón para regresar al inicio -->
    <a routerLink="/" class="volver-inicio">
      <button mat-button class="btn-azul" type="button">Regresar al inicio</button>
    </a>
  <h1>Crear Juego</h1>
  <form class="admin-form">
    <div class="form-section">
      <label>Nombre del Juego *</label>
      <input type="text" placeholder="Nombre del Juego..." />
    </div>
    <div class="form-section">
      <label>Categoría *</label>
      <select>
        <option>Seleccionar Categoría...</option>
      </select>
    </div>
    <div class="form-section">
      <label>Nivel Educativo *</label>
      <select>
        <option>Seleccionar Nivel...</option>
      </select>
    </div>
    <div class="form-section">
      <label>Fecha *</label>
      <input type="date" />
    </div>
    <div class="form-section">
      <label>Tipo de Juego y Acceso *</label>
      <input type="file" placeholder="Subir archivo..." />
      <input type="text" placeholder="Enlace externo..." />
    </div>
    <div class="form-section">
      <label>Instrucciones del Juego *</label>
      <textarea rows="6" placeholder="Escribe las instrucciones..."></textarea>
    </div>
    <div class="form-section">
      <label>Recursos complementarios *</label>
      <input type="file" placeholder="Subir archivo..." />
      <input type="file" placeholder="Subir archivo de preguntas..." />
    </div>
    <div class="form-section">
      <label>Temas Económicos Relacionados *</label>
      <input type="text" placeholder="Ej: Inflación, Comercio..." />
    </div>
    <div class="form-section opciones">
      <label>Visibilidad *</label>
      <div class="checkbox-group">
        <label><input type="checkbox" /> Público</label>
        <label><input type="checkbox" /> Solo estudiantes</label>
        <label><input type="checkbox" /> Interno / Borrador</label>
      </div>
    </div>
    <div class="form-buttons">
      <button type="button" class="guardar">Guardar</button>
      <button type="button" class="borrador">Guardar como borrador</button>
      <button type="submit" class="publicar">Publicar</button>
    </div>
  </form>
</div>
