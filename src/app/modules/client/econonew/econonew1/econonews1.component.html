<!-- LOADING STATE -->
<div *ngIf="loading" class="loading-container">
  <div class="spinner"></div>
  <p>Cargando noticia...</p>
</div>

<!-- CONTENIDO PRINCIPAL -->
<div *ngIf="!loading && news" class="news-detail-container">

  <!-- BOTÓN REGRESAR -->
  <div class="back-section">
    <button class="back-btn" (click)="regresar()">
      <span>← Regresar</span>
    </button>
  </div>

  <!-- BUSCADOR Y FILTROS -->
  <!-- <section class="search-section">
    <div class="search-box">
      <input type="text" placeholder="Buscar..." />
      <button class="search-btn">
        <img src="assets/images/lupa.png" alt="Buscar" width="16" height="16" />
      </button>
    </div>
    <div class="filters">
      <span>Categoría</span>
      <span>Nivel</span>
      <span>Tendencia</span>
    </div>
  </section> -->

  <!-- NOTICIA PRINCIPAL -->
  <main class="main-news" *ngIf="news">
    <div class="news-card-detail">

      <!-- METADATA -->
      <div class="news-card-header">
        <span class="date">
          <img src="assets/images/reloj.png" alt="Fecha" width="16" />
          {{ getFormattedDate(news) }}
        </span>
        <span class="tag yellow">{{ news.category || 'General' }}</span>
      </div>

      <!-- TÍTULO -->
      <h1 class="news-title">{{ news.title || 'Sin título' }}</h1>

      <!-- RESUMEN (primeros 200 caracteres del contenido) -->
      <!-- <p class="news-summary" *ngIf="news.content">
        {{ stripHtmlAndTruncate(news.content, 200) }}
      </p> -->

      <!-- KEYWORDS (si existen) -->
      <div class="keywords-section" *ngIf="news.keywords && news.keywords.length > 0">
        <h4>🏷️ Palabras clave:</h4>
        <div class="keywords-list">
          <span class="keyword" *ngFor="let keyword of news.keywords">
            #{{ keyword }}
          </span>
        </div>
      </div>

      <!-- IMAGEN -->
      <div class="news-image">
        <img [src]="getAutoImage(news)" [alt]="news.title || 'Noticia'" (error)="onImageError($event)" />
      </div>

      <!-- CONTENIDO COMPLETO -->
      <div class="news-content" [innerHTML]="news.content || 'Sin contenido'"></div>

    </div>
  </main>

</div>

<!-- ERROR STATE -->
<div *ngIf="!loading && !news" class="error-container">
  <h2>❌ Noticia no encontrada</h2>
  <p>Lo sentimos, no pudimos encontrar la noticia que buscas.</p>
  <button class="btn-back" (click)="regresar()">Volver a Noticias</button>
</div>
